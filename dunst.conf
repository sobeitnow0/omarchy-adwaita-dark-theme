# Adwaita Dark — Dunst Notification Config
# GNOME Shell notification popups aesthetic

[global]
font = Adwaita 11
markup = full
format = "<b>%s</b>\n%b"
sort = yes
indicate_hidden = yes
alignment = left
show_age_threshold = 60
word_wrap = yes
ignore_newline = no
stack_duplicates = true
hide_duplicate_count = false
show_indicators = yes
icon_position = left
min_icon_size = 32
max_icon_size = 48

# GNOME rounded popup geometry
width = (300, 440)
height = 150
offset = 16x50
origin = top-right
corner_radius = 12
frame_width = 1
gap_size = 8

[urgency_low]
background = "#242424"
foreground = "#c0bfbc"
frame_color = "#3d3d3d"
timeout = 5

[urgency_normal]
background = "#242424"
foreground = "#ffffff"
frame_color = "#3584e4"
timeout = 7

[urgency_critical]
background = "#242424"
foreground = "#ffffff"
frame_color = "#ed333b"
timeout = 0
